databases:
  - name: rottenpotatoes-db
    plan: free
    region: oregon
    databaseName: rottenpotatoes
    user: rottenpotatoes

services:
  - type: web
    name: rottenpotatoes-dotdevn
    runtime: ruby
    plan: free
    region: oregon
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: BUNDLE_WITHOUT
        value: development:test
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "0"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: DATABASE_URL
        fromDatabase:
          name: rottenpotatoes-db
          property: connectionString
